<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link class="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CyberShadow Login Page - Sign in to access your dashboard." />
    
    <!-- Google Fonts: Outfit and Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for modern sleek UI iconography -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/css/phosphor.css" />

    <title>CyberShadow — Log In</title>
  </head>
  <body>
    <!-- Cyberpunk grid background & ambient glow effects -->
    <div class="cyber-bg">
      <div class="grid-overlay"></div>
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
      <div class="glow-orb orb-3"></div>
    </div>

    <!-- Main Container -->
    <main class="login-container" id="loginApp">
      <div class="glass-card">
        <!-- Top Tech Decors -->
        <div class="card-decor top-left"></div>
        <div class="card-decor top-right"></div>
        <div class="card-decor-line"></div>

        <!-- Brand Header -->
        <div class="brand-header">
          <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <i class="ph-bold ph-shield-checkered logo-icon"></i>
          </div>
          <h1 class="brand-title">CYBER<span>SHADOW</span></h1>
          <p class="brand-subtitle">SECURE LOGIN PORTAL</p>
        </div>

        <!-- Terminal Status Bar -->
        <div class="status-bar">
          <span class="status-indicator online"></span>
          <span class="status-text" id="statusConsole">SYSTEM: READY</span>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form class="login-form" id="loginForm" autocomplete="off">
          <!-- Username / Email Input -->
          <div class="input-group">
            <label for="username" class="input-label">
              <i class="ph-bold ph-user-focus icon-field"></i>
              <span>Username or Email</span>
            </label>
            <div class="input-wrapper">
              <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="Enter your username or email" 
                required 
                autocomplete="username"
                spellcheck="false"
              />
              <span class="focus-border"></span>
            </div>
            <span class="error-msg" id="usernameError"></span>
          </div>

          <!-- Password Input -->
          <div class="input-group">
            <label for="password" class="input-label">
              <i class="ph-bold ph-key icon-field"></i>
              <span>Password</span>
            </label>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Enter your password" 
                required 
                autocomplete="current-password"
              />
              <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                <i class="ph-bold ph-eye" id="toggleIcon"></i>
              </button>
              <span class="focus-border"></span>
            </div>
            <span class="error-msg" id="passwordError"></span>
            <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
          </div>

          <!-- Options -->
          <div class="form-options">
            <label class="custom-checkbox">
              <input type="checkbox" id="rememberMe" name="remember" />
              <span class="checkbox-box">
                <i class="ph-bold ph-check check-icon"></i>
              </span>
              <span class="checkbox-label">Remember me</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">LOG IN</span>
            <div class="btn-glow"></div>
            <i class="ph-bold ph-fingerprint btn-icon"></i>
          </button>
        </form>

        <!-- ===== REGISTER FORM (hidden by default) ===== -->
        <form class="login-form register-form" id="registerForm" autocomplete="off">
          <!-- Username -->
          <div class="input-group">
            <label for="regUsername" class="input-label">
              <i class="ph-bold ph-user icon-field"></i>
              <span>Username</span>
            </label>
            <div class="input-wrapper">
              <input
                type="text"
                id="regUsername"
                name="regUsername"
                placeholder="Enter your username"
                autocomplete="username"
                spellcheck="false"
              />
              <span class="focus-border"></span>
            </div>
            <span class="error-msg" id="regUsernameError"></span>
          </div>

          <!-- Email -->
          <div class="input-group">
            <label for="regEmail" class="input-label">
              <i class="ph-bold ph-envelope-simple icon-field"></i>
              <span>Email Address</span>
            </label>
            <div class="input-wrapper">
              <input
                type="email"
                id="regEmail"
                name="regEmail"
                placeholder="Enter your email address"
                autocomplete="email"
                spellcheck="false"
              />
              <span class="focus-border"></span>
            </div>
            <span class="error-msg" id="regEmailError"></span>
          </div>

          <!-- Password -->
          <div class="input-group">
            <label for="regPassword" class="input-label">
              <i class="ph-bold ph-key icon-field"></i>
              <span>Password</span>
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="regPassword"
                name="regPassword"
                placeholder="Create a password (min. 6 characters)"
                autocomplete="new-password"
              />
              <button type="button" class="btn-toggle-password" id="toggleRegPassword" aria-label="Toggle password visibility">
                <i class="ph-bold ph-eye" id="toggleRegIcon"></i>
              </button>
              <span class="focus-border"></span>
            </div>
            <span class="error-msg" id="regPasswordError"></span>
          </div>

          <!-- Confirm Password -->
          <div class="input-group">
            <label for="regConfirm" class="input-label">
              <i class="ph-bold ph-lock icon-field"></i>
              <span>Confirm Password</span>
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="regConfirm"
                name="regConfirm"
                placeholder="Repeat your password"
                autocomplete="new-password"
              />
              <span class="focus-border"></span>
            </div>
            <span class="error-msg" id="regConfirmError"></span>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-submit" id="registerBtn">
            <span class="btn-text">CREATE ACCOUNT</span>
            <div class="btn-glow"></div>
            <i class="ph-bold ph-user-plus btn-icon"></i>
          </button>
        </form>

        <!-- System Notification Log -->
        <div class="terminal-log" id="terminalLog">
          <div class="log-line">> Connecting to server...</div>
          <div class="log-line">> Securing connection...</div>
        </div>

        <!-- Footer - switches between login and register -->
        <div class="card-footer" id="cardFooter">
          <p id="footerLogin">Don't have an account? <a href="#" class="signup-link" id="showRegister">Register here</a></p>
          <p id="footerRegister" style="display:none;">Already have an account? <a href="#" class="signup-link" id="showLogin">Log in</a></p>
        </div>
      </div>

      <!-- Footer Branding -->
      <footer class="system-footer">
        <span>NODE-ID: SHADOW_099</span>
        <span class="footer-dot">•</span>
        <span id="systemTime">TIME: 2026-05-26 13:58:47</span>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
