<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link class="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/index.css" />

    <title>CyberShadow — Reset Password</title>
  </head>
  <body>
    <!-- Background -->
    <div class="cyber-bg">
      <div class="grid-overlay"></div>
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
    </div>

    <main class="login-container">
      <div class="glass-card">
        <div class="card-decor top-left"></div>
        <div class="card-decor top-right"></div>
        <div class="card-decor-line"></div>

        <div class="brand-header">
          <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <img src="/favicon.svg" alt="CyberShadow Logo" class="logo-icon" />
          </div>
          <h1 class="brand-title">PASSWORD<span>RESET</span></h1>
          <p class="brand-subtitle">UPDATE YOUR IDENTITY</p>
        </div>

        <div class="status-bar">
          <span class="status-indicator online"></span>
          <span class="status-text" id="statusConsole">SYSTEM: READY</span>
        </div>

        <form class="login-form" id="resetPasswordForm" autocomplete="off">
          <div class="input-group">
            <label for="newPassword" class="input-label">
              <i class="ph-bold ph-key icon-field"></i>
              <span>New Password</span>
            </label>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="newPassword" 
                placeholder="Enter new password (min. 6 chars)" 
                required 
              />
              <button type="button" class="btn-toggle-password" id="togglePassword">
                <i class="ph-bold ph-eye" id="toggleIcon"></i>
              </button>
              <span class="focus-border"></span>
            </div>
            <span class="error-msg" id="passwordError"></span>
          </div>

          <div class="input-group">
            <label for="confirmPassword" class="input-label">
              <i class="ph-bold ph-lock icon-field"></i>
              <span>Confirm New Password</span>
            </label>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="confirmPassword" 
                placeholder="Repeat new password" 
                required 
              />
              <span class="focus-border"></span>
            </div>
            <span class="error-msg" id="confirmError"></span>
          </div>

          <button type="submit" class="btn-submit" id="resetBtn">
            <span class="btn-text">UPDATE PASSWORD</span>
            <div class="btn-glow"></div>
            <i class="ph-bold ph-check-circle btn-icon"></i>
          </button>
        </form>

        <div class="card-footer">
          <p><a href="/" class="signup-link">Back to Login</a></p>
        </div>
      </div>

      <footer class="system-footer">
        <span>RECOVERY-MODE: ACTIVE</span>
        <span class="footer-dot">•</span>
        <span id="systemTime"></span>
      </footer>
    </main>

    <script type="module" src="/src/reset-password.js"></script>
  </body>
</html>
