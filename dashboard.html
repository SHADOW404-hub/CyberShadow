<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link class="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShadow — Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for modern sleek UI iconography -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/css/phosphor.css" />
  </head>
  <body>
    <div class="dashboard-wrapper">
      <!-- Top Navigation -->
      <header class="dashboard-header">
        <a href="/dashboard.html" class="header-brand-logo">
          <img src="/favicon.svg" alt="CyberShadow Logo" class="dashboard-logo-img" />
          <span class="brand-text">CYBER<span>SHADOW</span></span>
        </a>
        
        <nav class="main-menu">
          <a href="#" class="menu-link">Challenge</a>
          <a href="#" class="menu-link">Scoreboard</a>
          <a href="#" class="menu-link" id="adminTerminalLink" style="display: none;">Admin Terminal</a>
        </nav>

        <div class="user-profile-section">
          <div class="profile-display glitch-hover" id="profileBtn">
            <span id="userEmail">Agent</span>
            <div class="profile-avatar" id="headerProfileAvatar">
              <i class="ph-bold ph-user"></i>
            </div>
          </div>
          <!-- Dropdown menu -->
          <div class="profile-dropdown">
              <a href="#" class="dropdown-item" id="editProfileBtn">
                  <i class="ph-bold ph-user-circle"></i> Profile
              </a>
              <button id="logoutBtn" class="dropdown-item logout">
                  <i class="ph-bold ph-sign-out"></i> Log Out
              </button>
          </div>
        </div>
      </header>

      <!-- Asosiy kontent -->
      <main class="dashboard-main-content">
        <div class="dashboard-grid">
          <div class="stat-card fade-in-up" style="animation-delay: 0.8s;">
            <div class="stat-title">System Status</div>
            <div class="stat-value">ONLINE</div>
            <div class="stat-decor"></div>
          </div>
          <div class="stat-card fade-in-up" style="animation-delay: 1s;">
            <div class="stat-title">Challenges Solved</div>
            <div class="stat-value">0 / 100</div>
            <div class="stat-decor"></div>
          </div>
          <div class="stat-card fade-in-up" style="animation-delay: 1.2s;">
            <div class="stat-title">Global Rank</div>
            <div class="stat-value">#---</div>
            <div class="stat-decor"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal-overlay">
      <div class="glass-card modal-content">
        <div class="card-decor top-left"></div>
        <div class="card-decor top-right"></div>
        <div class="card-decor-line"></div>
        
        <div class="modal-header">
          <h3>USER PROFILE</h3>
        </div>
        
        <div class="modal-body">
          <div class="info-group">
            <label>Username</label>
            <div class="input-action-wrapper">
              <input type="text" id="modalUsername" placeholder="Username" readonly>
              <button type="button" class="btn-inline-change" data-target="modalUsername">CHANGE</button>
            </div>
          </div>
          <div class="info-group">
            <label>Email Address</label>
            <div class="input-action-wrapper">
              <input type="email" id="modalEmail" placeholder="Email" readonly>
              <button type="button" class="btn-inline-change" data-target="modalEmail">CHANGE</button>
            </div>
          </div>
          <div class="info-group">
            <label>Country</label>
            <div class="input-action-wrapper">
              <select id="modalCountry" class="modal-select" disabled>
                <option value="">Not selected</option>
              </select>
              <button type="button" class="btn-inline-change" data-target="modalCountry">CHANGE</button>
            </div>
          </div>
        </div>
        <div class="info-group">
          <label>Profile Picture</label>
          <div class="avatar-edit-container">
            <div class="profile-avatar-preview" id="profilePicturePreview"></div>
            <input type="file" id="modalProfilePictureInput" accept="image/*" style="display: none;">
            <button type="button" class="btn-inline-change" id="changeProfilePictureBtn" style="height: 30px; padding: 0 20px;">CHANGE</button>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-cancel" id="cancelModal">Cancel</button>
          <button class="btn-save" id="saveProfile">Save Changes</button>
        </div>
      </div>
    </div>

    <!-- Dashboard specific unique background -->
    <div class="dashboard-unique-bg">
      <div class="cyber-grid-floor"></div>
      <div class="digital-dust"></div>
      <div class="horizon-glow"></div>
    </div>

    <!-- Background Cyber effects -->
    <div class="cyber-bg">
      <div class="grid-overlay"></div>
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
      <div class="glow-orb orb-3"></div>
    </div>

    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
