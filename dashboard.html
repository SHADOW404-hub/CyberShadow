<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link class="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShadow — Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for modern sleek UI iconography -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/index.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Silliq yon menyu -->
      <nav class="side-nav">
        <div class="nav-logo">
          <div class="logo-dot"></div>
          <span>CS</span>
        </div>
        <div class="nav-links">
          <a href="#" class="nav-link active"><i class="ph-fill ph-house"></i></a>
          <a href="#" class="nav-link"><i class="ph-bold ph-chart-pie-slice"></i></a>
          <a href="#" class="nav-link"><i class="ph-bold ph-shield-check"></i></a>
          <a href="#" class="nav-link"><i class="ph-bold ph-user"></i></a>
        </div>
        <button class="btn-logout-icon" id="logoutBtn">
          <i class="ph-bold ph-sign-out"></i>
        </button>
      </nav>

      <!-- Asosiy kontent -->
      <main class="main-content">
        <header class="top-bar">
          <div class="welcome-text">
            <h1>Salom, <span id="userEmail">Agent</span></h1>
            <p>Tizim holati barqaror va himoyalangan.</p>
          </div>
          <div class="status-pill">
            <span class="pulse-dot"></span>
            ONLINE
          </div>
        </header>

        <div class="content-grid">
          <!-- Asosiy karta -->
          <div class="glass-panel main-stats reveal-1">
            <div class="panel-header">Xavfsizlik monitoringi</div>
            <div class="stats-placeholder">
              <div class="big-circle-progress">
                <span class="percentage">98%</span>
                <span class="label">Secure</span>
              </div>
            </div>
          </div>
          <!-- Kichik kartalar -->
          <div class="glass-panel info-card reveal-2">
            <div class="panel-header">So'nggi harakatlar</div>
            <div class="simple-list">
              <div class="list-item"><span>Muvaffaqiyatli kirish</span><time>Hozir</time></div>
              <div class="list-item"><span>IP tekshiruvi</span><time>2 daq avval</time></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Background Cyber effects -->
    <div class="cyber-bg">
      <div class="grid-overlay"></div>
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
    </div>
    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
