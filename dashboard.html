<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link class="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShadow — Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for modern sleek UI iconography -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/index.css" />
  </head>
  <body>
    <!-- Main Dashboard Root -->
    <div class="dashboard-root">
      <!-- Background decorative layer -->
      <div class="hud-scanline"></div>
      
      <!-- Navigation Sidebar -->
      <aside class="hud-sidebar">
        <div class="sidebar-logo">
          <i class="ph-bold ph-shield-checkered"></i>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-item active"><i class="ph-bold ph-squares-four"></i></button>
          <button class="nav-item"><i class="ph-bold ph-database"></i></button>
          <button class="nav-item"><i class="ph-bold ph-shield-chevron"></i></button>
          <button class="nav-item"><i class="ph-bold ph-terminal-window"></i></button>
          <button class="nav-item"><i class="ph-bold ph-gear"></i></button>
        </nav>
        <button class="nav-item logout" id="logoutBtn"><i class="ph-bold ph-power"></i></button>
      </aside>

      <!-- Content Canvas -->
      <main class="hud-canvas">
        <!-- Header Info -->
        <header class="hud-header">
          <div class="header-left">
            <span class="system-label">STATUS:</span>
            <span class="system-value online">OPERATIONAL</span>
            <div class="separator"></div>
            <span class="system-label">AGENT:</span>
            <span class="system-value" id="userEmail">...</span>
          </div>
          <div class="header-right">
            <span class="system-clock">NODE_ID: CS_77X</span>
          </div>
        </header>

        <!-- Widgets Grid -->
        <div class="hud-grid">
          <!-- System Monitor -->
          <div class="hud-widget col-8 row-2 boot-1">
            <div class="widget-header">SYSTEM MONITOR</div>
            <div class="widget-content placeholder-data"></div>
          </div>
          <!-- Data Stream -->
          <div class="hud-widget col-4 row-3 boot-2">
            <div class="widget-header">NETWORK LOGS</div>
            <div class="widget-content terminal-mini">
              <div class="log-entry">> SECURE_LINK established...</div>
              <div class="log-entry">> Handshake complete.</div>
              <div class="log-entry">> Watching node: #7712</div>
            </div>
          </div>
          <!-- Stats -->
          <div class="hud-widget col-4 row-1 boot-3">
            <div class="widget-header">ENCRYPTION LEVEL</div>
            <div class="widget-content stats-box">256-AES</div>
          </div>
          <div class="hud-widget col-4 row-1 boot-4">
            <div class="widget-header">CPU_LOAD</div>
            <div class="widget-content bar-container"><div class="bar" style="width: 65%;"></div></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Background Cyber effects -->
    <div class="cyber-bg">
      <div class="grid-overlay"></div>
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
    </div>
    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
