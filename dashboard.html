<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link class="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShadow — Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for modern sleek UI iconography -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/index.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Top Navigation -->
      <header class="dashboard-header">
        <a href="/dashboard.html" class="header-brand">
          <div class="brand-logo">
            <img src="/favicon.svg" alt="CyberShadow Logo" />
          </div>
          <span class="brand-name">CYBER<span>SHADOW</span></span>
        </a>
        
        <nav class="header-menu">
          <a href="#" class="menu-item">Challenge</a>
          <a href="#" class="menu-item">Scoreboard</a>
        </nav>

        <div class="header-profile">
          <div class="profile-info" id="profileBtn">
            <span id="userEmail">Agent</span>
            <div class="profile-avatar">
              <i class="ph-bold ph-user"></i>
            </div>
          </div>
          <button class="btn-logout" id="logoutBtn" title="Logout">
            <i class="ph-bold ph-sign-out"></i>
          </button>
        </div>
      </header>

      <!-- Asosiy kontent -->
      <main class="dashboard-content">
        <!-- Content will be added here later -->
      </main>
    </div>

    <!-- Background Cyber effects -->
    <!-- This background is likely global and should be in index.html or body style. Removing from here to avoid duplication. -->
    <div class="cyber-bg">
      <div class="grid-overlay"></div>
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
      <div class="glow-orb orb-3"></div>
    </div>
    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
